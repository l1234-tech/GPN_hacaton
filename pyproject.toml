[project]
name = "pdf-parsing-baseline"
version = "0.1.0"
description = "Baseline (Docling) для парсинга PDF в Markdown + публичный датасет"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hackathon Organizers" }]
dependencies = [
    "beautifulsoup4>=4.14.3",
    "camelot-py[cv]>=1.0.9",
    "docling>=2.0",
    "gmft>=0.4.2",
    "google-generativeai>=0.8.6",
    "img2table>=1.4.2",
    "layoutparser>=0.3.4",
    "lxml>=6.0.4",
    "marker-pdf>=1.10.2",
    "opencv-python>=4.13.0.92",
    "opencv-python-headless>=4.8,<5",
    "paddleocr>=3.4.1",
    "paddlepaddle>=3.3.1",
    "pandas>=2.3.3",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.9",
    "pillow>=10.4.0",
    "pymupdf>=1.27.2.2",
    "pymupdf4llm>=1.27.2.2",
    "pypdfium2>=4.30.0",
    "pytesseract>=0.3.13",
    "python-levenshtein>=0.27.3",
    "rapidfuzz>=3.14.5",
    "timm>=1.0.26",
    "torch>=2.11.0",
    "transformers>=4.57.6",
]

[project.scripts]
baseline-docling = "baseline.docling_baseline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["baseline"]
